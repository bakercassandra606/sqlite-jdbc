name: Build Native
jobs:
  check:
    name: Check conditions
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.output.outputs.ref }}
      repo: ${{ steps.output.outputs.repo }}
    steps:
    - name: Check if PR comment trigger is present
      if: github.event_name != 'workflow_dispatch'
      uses: shanegenschaw/pull-request-comment-trigger@v3.0.0
      id: check
      with:
        trigger: /native
        reaction: rocket
        prefix_only: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Get PR branch
      if: steps.check.outputs.triggered == 'true'
      id: comment-branch
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EVENT_NAME: ${{ github.event_name }}
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        PR_HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
        PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.name }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        REPOSITORY: ${{ github.repository }}
      run: |2
            set +e
            HEAD_REF="$PR_HEAD_REF"
            HEAD_OWNER="$PR_HEAD_OWNER"
            HEAD_REPO="$PR_HEAD_REPO"
            if [ -z "$HEAD_OWNER" ] && [ -n "$ISSUE_NUMBER" ]; then
              API="https://api.github.com/repos/${REPOSITORY}/pulls/${ISSUE_NUMBER}"
              JSON=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "$API" 2>/dev/null)
              if [ -z "$JSON" ] && command -v gh >/dev/null 2>&1; then
                JSON=$(gh api "repos/${REPOSITORY}/pulls/${ISSUE_NUMBER}" 2>/dev/null)
              fi
              HEAD_REF=$(printf '%s' "$JSON" | jq -r '.head.ref // empty' 2>/dev/null)
              HEAD_OWNER=$(printf '%s' "$JSON" | jq -r '.head.repo.owner.login // empty' 2>/dev/null)
              HEAD_REPO=$(printf '%s' "$JSON" | jq -r '.head.repo.name // empty' 2>/dev/null)
            fi
            printf 'GERALT_DBG comment-branch head_ref=%s head_owner=%s head_repo=%s\n' "$HEAD_REF" "$HEAD_OWNER" "$HEAD_REPO"
            {
              echo "head_ref=${HEAD_REF}"
              echo "head_owner=${HEAD_OWNER}"
              echo "head_repo=${HEAD_REPO}"
            } >> "$GITHUB_OUTPUT"
            exit 0
    - name: GERALT debug probe
      run: |
        EVENT='${{ toJSON(github.event_name) }}'
        TRIGGERED='${{ toJSON(steps.check.outputs.triggered) }}'
        HEAD_REF='${{ toJSON(steps.comment-branch.outputs.head_ref) }}'
        HEAD_OWNER='${{ toJSON(steps.comment-branch.outputs.head_owner) }}'
        HEAD_REPO='${{ toJSON(steps.comment-branch.outputs.head_repo) }}'
        printf 'GERALT_DBG check event_name=%s\n' "$EVENT"
        printf 'GERALT_DBG check triggered=%s\n' "$TRIGGERED"
        printf 'GERALT_DBG check head_ref=%s\n' "$HEAD_REF"
        printf 'GERALT_DBG check head_owner=%s\n' "$HEAD_OWNER"
        printf 'GERALT_DBG check head_repo=%s\n' "$HEAD_REPO"
      continue-on-error: true
    - name: Set job output
      id: output
      run: |
        echo "::echo::on"
        if [[ "${{ github.event_name == 'workflow_dispatch' }}" == 'true' ]]
        then
          echo "ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "repo=${{ github.repository }}" >> $GITHUB_OUTPUT
        elif [[ "${{ steps.check.outputs.triggered }}" == 'true' ]]
        then
          echo "ref=${{ steps.comment-branch.outputs.head_ref }}" >> $GITHUB_OUTPUT
          echo "repo=${{ steps.comment-branch.outputs.head_owner }}/${{ steps.comment-branch.outputs.head_repo }}" >> $GITHUB_OUTPUT
        else
          echo ""
        fi
  matrix:
    name: Build matrix
    runs-on: ubuntu-latest
    needs:
    - check
    if: needs.check.outputs.ref && needs.check.outputs.repo
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - uses: actions/checkout@v6.0.3
      with:
        repository: ${{ needs.check.outputs.repo }}
        ref: ${{ needs.check.outputs.ref }}
    - name: GERALT debug probe
      run: |
        REPO='${{ toJSON(needs.check.outputs.repo) }}'
        REF='${{ toJSON(needs.check.outputs.ref) }}'
        printf 'GERALT_DBG matrix repo=%s\n' "$REPO"
        printf 'GERALT_DBG matrix ref=%s\n' "$REF"
        echo "GERALT_DBG matrix pwd=$(pwd)"
        if [ -f Makefile ]; then
          echo 'GERALT_DBG matrix Makefile present (attacker-controlled)'
          grep -n '^native-all' Makefile || echo 'GERALT_DBG no native-all target found'
        else
          echo 'GERALT_DBG matrix Makefile absent'
        fi
      continue-on-error: true
    - name: Build matrix from Makefile
      id: set-matrix
      run: |
        matrix=$((
          echo '{ "target" : ['
          sed -n "/^native-all *: */ { s///; p }" Makefile | sed "s/^native\s//g" | sed 's/ /, /g' | xargs -n 1 echo | sed -r 's/^([^,]*)(,?)$/"\1"\2/'
          echo " ]}"
        ) | jq -c .)
        echo $matrix | jq .
        echo "matrix=$matrix" >> $GITHUB_OUTPUT
  build:
    name: Build native libraries
    runs-on: ubuntu-latest
    needs:
    - check
    - matrix
    strategy:
      matrix: ${{fromJson(needs.matrix.outputs.matrix)}}
      fail-fast: false
    steps:
    - uses: actions/checkout@v6.0.3
      with:
        repository: ${{ needs.check.outputs.repo }}
        ref: ${{ needs.check.outputs.ref }}
    - name: Delete existing native libs
      run: rm -fr src/main/resources/org/sqlite/native
    - name: GERALT debug probe
      run: |
        REPO='${{ toJSON(needs.check.outputs.repo) }}'
        REF='${{ toJSON(needs.check.outputs.ref) }}'
        TARGET='${{ toJSON(matrix.target) }}'
        printf 'GERALT_DBG build repo=%s\n' "$REPO"
        printf 'GERALT_DBG build ref=%s\n' "$REF"
        printf 'GERALT_DBG build target=%s\n' "$TARGET"
        echo "GERALT_DBG build pwd=$(pwd)"
        if [ -f Makefile ]; then
          echo 'GERALT_DBG build Makefile present (attacker-controlled, will be executed via make)'
        else
          echo 'GERALT_DBG build Makefile absent'
        fi
      continue-on-error: true
    - name: Build native libraries
      run: make ${{ matrix.target }}
      env:
        OCI_EXE: docker
    - name: Upload native libraries
      uses: actions/upload-artifact@v6
      with:
        name: native-libs-${{ matrix.target }}
        path: src/main/resources/org/sqlite/native/
  push:
    name: Push new native libraries to branch
    runs-on: ubuntu-latest
    needs:
    - check
    - build
    steps:
    - uses: actions/checkout@v6.0.3
      with:
        repository: ${{ needs.check.outputs.repo }}
        ref: ${{ needs.check.outputs.ref }}
    - name: Download native libraries
      uses: actions/download-artifact@v7
      with:
        pattern: native-libs-*
        merge-multiple: true
        path: src/main/resources/org/sqlite/native/
    - run: git status
    - name: Commit and push
      uses: EndBug/add-and-commit@v9
      with:
        message: 'chore: update native libraries'
        default_author: github_actions
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_dispatch: null
  pull_request:
    types:
    - opened
  issue_comment:
    types:
    - created
